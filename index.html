<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-title" content="FamilyConnect">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>FamilyConnect</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:#F7F9FB;
    color:#1F2937;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* Header */
  .header{
    background:linear-gradient(135deg,#16324F,#1F4A6B);
    padding:24px 16px 16px;
    text-align:center;
    box-shadow:0 2px 16px rgba(22,50,79,0.25);
  }
  .header .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
  .header .logo svg{width:32px;height:32px}
  .header h1{font-size:20px;font-weight:800;letter-spacing:2px;color:#fff}
  .header .tagline{font-size:12px;color:rgba(255,255,255,0.85);font-weight:500;margin-top:2px}


  /* Filters */
  .filters{
    position:sticky;top:0;z-index:10;
    background:#F7F9FB;
    padding:12px 16px;
    border-bottom:1px solid #DCE3E8;
    box-shadow:0 2px 8px rgba(0,0,0,0.04);
  }
  .filter-row{display:flex;gap:8px;margin-bottom:10px}
  .filter-row:last-child{margin-bottom:0}

  .btn{border:none;border-radius:12px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}

  /* Name buttons */
  .name-btn{flex:1;padding:10px 0;font-size:15px;border-radius:12px}
  .name-btn.active{background:#1F6F78;color:#fff;box-shadow:0 3px 12px rgba(31,111,120,0.3)}
  .name-btn:not(.active){background:#E7F1F1;color:#16324F}

  /* Day buttons */
  .day-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .day-scroll::-webkit-scrollbar{display:none}
  .day-btn{flex-shrink:0;padding:8px 12px;font-size:12px;font-weight:600;border-radius:10px;min-width:56px;text-align:center}
  .day-btn.active{background:#1F6F78;color:#fff;box-shadow:0 2px 8px rgba(31,111,120,0.25)}
  .day-btn:not(.active){background:#E7F1F1;color:#3C6B72}
  .day-btn .label{font-size:9px;margin-top:2px;opacity:.7;font-weight:500}

  /* Type buttons */
  .type-btn{flex:1;padding:8px 0;font-size:12px;font-weight:600;border-radius:10px}
  .type-btn:not(.active){background:#EEF2F4;color:#6B7280}
  .type-btn.active[data-t="All"]{background:#1F6F78;color:#fff}
  .type-btn.active[data-t="Yoga"]{background:#7C5CC4;color:#fff}
  .type-btn.active[data-t="Breathing"]{background:#3AAFA9;color:#fff}
  .type-btn.active[data-t="Exercise"]{background:#E08A2E;color:#fff}

  /* Content */
  .content{padding:16px}

  .day-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .day-header .emoji{font-size:22px}
  .day-header h2{font-size:22px;font-weight:800;color:#1F2937}
  .day-header .tag{font-size:12px;color:#F26B4A;font-weight:700;background:#FCE7E1;padding:2px 10px;border-radius:20px;margin-left:4px}

  /* Cards */
  .card{margin-bottom:20px;border-radius:16px;overflow:hidden;border:1.5px solid;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
  .card.Yoga{background:#F5F2FC;border-color:#D9CCF2}
  .card.Breathing{background:#EAF7F6;border-color:#B9E4E1}
  .card.Exercise{background:#FDF4E8;border-color:#F0CE99}

  .card-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .card.Yoga .card-head{border-bottom:1px solid #E9E1F7}
  .card.Breathing .card-head{border-bottom:1px solid #CFEEEC}
  .card.Exercise .card-head{border-bottom:1px solid #F5E1BE}

  .card-type{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .card.Yoga .card-type{color:#7C5CC4}
  .card.Breathing .card-type{color:#3AAFA9}
  .card.Exercise .card-type{color:#E08A2E}

  .card-title{font-size:16px;font-weight:700;color:#1F2937;margin-top:3px}
  .card-time{font-size:11px;color:#6B7280;text-align:right;white-space:nowrap;font-weight:500}

  .card-note{padding:8px 16px;font-size:12px;color:#6B7280;font-style:italic}
  .card.Yoga .card-note{background:rgba(124,92,196,0.06);border-bottom:1px solid #E9E1F7}
  .card.Breathing .card-note{background:rgba(58,175,169,0.06);border-bottom:1px solid #CFEEEC}
  .card.Exercise .card-note{background:rgba(224,138,46,0.06);border-bottom:1px solid #F5E1BE}

  .card-body{padding:12px 16px}

  .item{padding:8px 0;font-size:14px;line-height:1.6;color:#1F2937;border-bottom:1px solid rgba(0,0,0,0.05)}
  .item:last-child{border-bottom:none}
  .item.sub{color:#6B7280;font-style:italic;padding-left:16px;font-size:13px}
  .item.warn{color:#B7791F;font-size:13px;font-weight:500}
  .item .num{font-weight:700;margin-right:8px;font-size:13px}
  .card.Yoga .num{color:#7C5CC4}
  .card.Breathing .num{color:#3AAFA9}
  .card.Exercise .num{color:#E08A2E}

  /* Section blocks (for exercise) */
  .sec-head{padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:10px;font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:.3px}
  .card.Yoga .sec-head{color:#7C5CC4}
  .card.Breathing .sec-head{color:#3AAFA9}
  .card.Exercise .sec-head{color:#E08A2E}

  .sec-block{margin-bottom:16px}
  .sec-block:last-child{margin-bottom:0}

  .sec-item{padding:6px 8px;font-size:13px;line-height:1.6;color:#1F2937;border-bottom:1px solid rgba(0,0,0,0.04)}
  .sec-item:last-child{border-bottom:none}
  .sec-item.sub{color:#6B7280;font-style:italic;padding-left:16px}
  .sec-item.warn{color:#B7791F;font-weight:500}
  .sec-item.group{font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:10px 8px 2px;margin-top:4px;border-bottom:none;opacity:.7}
  .card.Exercise .sec-item.group{color:#B8691E}

  /* Footer */
  .footer{padding:20px 16px 12px;text-align:center}
  .footer .pain{font-size:11px;color:#6B7280;margin-bottom:12px}
  .footer .brand{font-size:11px;color:#94A3AE;font-weight:500}
  .footer .brand strong{color:#F26B4A;font-weight:700}

  /* Safe area for notched phones */
  @supports(padding-top: env(safe-area-inset-top)){
    .header{padding-top:calc(24px + env(safe-area-inset-top))}
    .footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  }

  /* Food card */
  .card.Food{background:#EFF8EF;border-color:#C3E2C6}
  .card.Food .card-head{border-bottom:1px solid #DCEEDD}
  .card.Food .card-type{color:#4F9D59}
  .card.Food .card-note{background:rgba(79,157,89,0.06);border-bottom:1px solid #DCEEDD}
  .card.Food .sec-head{color:#4F9D59}
  .type-btn.active[data-t="Food"]{background:#4F9D59;color:#fff}

  .meal-ref{padding:10px 12px;border-radius:12px;background:#fff;margin-bottom:8px;border:1.5px solid #DCEEDD}
  .meal-ref:last-child{margin-bottom:0}
  .meal-name{font-size:14px;font-weight:700;color:#1F2937}
  .meal-macros{font-size:11px;color:#5E8A63;margin-top:2px}

  .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .macro-pill{background:#fff;border:1px solid #DCEEDD;border-radius:12px;padding:10px 6px;text-align:center}
  .macro-val{font-size:15px;font-weight:800;color:#4F9D59}
  .macro-label{font-size:10px;color:#5E8A63;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}

  /* Progress tab */
  .day-btn.prog-tab{background:#E6F0F8;color:#2878B5}
  .day-btn.prog-tab.active{background:#2878B5;color:#fff;box-shadow:0 2px 8px rgba(40,120,181,.3)}

  .prog-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1.5px solid #DCE3E8}
  .prog-title{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#6B7280;margin-bottom:10px}
  .prog-subtitle{font-size:12px;font-weight:600;color:#6B7280;margin:10px 0 6px}
  .prog-label{font-size:12px;font-weight:600;color:#6B7280;display:block;margin-bottom:6px}
  .prog-hint{font-size:11px;color:#94A3AE;margin-top:8px;font-style:italic}
  .prog-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #DCE3E8;font-family:inherit;font-size:14px;background:#F7F9FB;resize:vertical}

  .bmi-pill{display:inline-flex;align-items:baseline;gap:6px;background:#E6F0F8;border-radius:12px;padding:8px 14px;margin:10px 0 4px}
  .bmi-val{font-size:20px;font-weight:800;color:#2878B5}
  .bmi-label{font-size:11px;font-weight:700;color:#1F5D8C;text-transform:uppercase;letter-spacing:.3px}

  .flag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .flag-chip{padding:8px 14px;border-radius:20px;background:#EEF2F4;color:#6B7280;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
  .flag-chip.active-green{background:#2E8B57;color:#fff}
  .flag-chip.active-yellow{background:#CC8A3C;color:#fff}
  .flag-chip.active-red{background:#F26B4A;color:#fff}
</style>
</head>

// ---------- Weekly check-in (localStorage, one persistent record per person) ----------
const HEIGHT_M={Siva:1.64,Sutharia:1.50};
function todayKey(){return new Date().toLocaleDateString('en-CA')}
function blankCheckin(){return{weight:"",waist:"",hip:"",water:"",food:"",notes:"",updatedAt:""}}
function getCheckin(name){
  try{const all=JSON.parse(localStorage.getItem('fc_checkin_v1')||'{}');return Object.assign(blankCheckin(),all[name]||{})}
  catch(e){return blankCheckin()}
}
function saveCheckinField(name,patch){
  try{
    const all=JSON.parse(localStorage.getItem('fc_checkin_v1')||'{}');
    all[name]=Object.assign(getCheckin(name),patch,{updatedAt:todayKey()});
    localStorage.setItem('fc_checkin_v1',JSON.stringify(all));
  }catch(e){}
}
function onCheckinInput(field,val){saveCheckinField(state.name,{[field]:val});render()}
function setWater(level){const c=getCheckin(state.name);saveCheckinField(state.name,{water:c.water===level?"":level});render()}
function setFood(level){const c=getCheckin(state.name);saveCheckinField(state.name,{food:c.food===level?"":level});render()}

// ---------- Rendering ----------
function renderSections(sec,cardCls){
  let html="";
  if(sec.items){
    let num=0;
    sec.items.forEach(item=>{
      const isSub=item.startsWith("  \u21b3");
      const isWarn=item.startsWith("\u26a0\ufe0f");
      const cls=isSub?"item sub":isWarn?"item warn":"item";
      if(!isSub&&!isWarn) num++;
      const prefix=(!isSub&&!isWarn)?`<span class="num">${num}.</span>`:"";
      html+=`<div class="${cls}">${prefix}${item}</div>`;
    });
  }
  if(sec.sections){
    sec.sections.forEach(s=>{
      html+=`<div class="sec-block"><div class="sec-head">${s.name}</div>`;
      s.items.forEach(item=>{
        const isSub=item.startsWith("  \u21b3");
        const isWarn=item.startsWith("\u26a0\ufe0f");
        const isGroup=item.startsWith("Superset ")||item.startsWith("Finisher ");
        const cls=isSub?"sec-item sub":isWarn?"sec-item warn":isGroup?"sec-item group":"sec-item";
        html+=`<div class="${cls}">${item}</div>`;
      });
      html+=`</div>`;
    });
  }
  return html;
}

function renderFoodCard(food){
  if(!food) return "";
  let html=`<div class="card Food"><div class="card-head"><div><div class="card-type">${typeEmoji.Food} FOOD</div><div class="card-title">${food.title}</div></div><div class="card-time">${food.time}</div></div>`;
  if(food.note) html+=`<div class="card-note">${food.note}</div>`;
  html+=`<div class="card-body">`;
  html+=`<div class="sec-block"><div class="sec-head">DAILY TARGETS</div><div class="macro-grid">`;
  food.targets.forEach(tg=>{html+=`<div class="macro-pill"><div class="macro-val">${tg.val}</div><div class="macro-label">${tg.label}</div></div>`});
  html+=`</div></div>`;
  html+=`<div class="sec-block"><div class="sec-head">PER-MEAL BREAKDOWN</div>`;
  food.meals.forEach(m=>{
    html+=`<div class="meal-ref"><div class="meal-name">${m.name}</div><div class="meal-macros">${m.cals} \u00b7 ${m.protein} protein \u00b7 ${m.carb} carb \u00b7 ${m.fat} fat \u00b7 ${m.fibre} fibre</div></div>`;
  });
  html+=`</div>`;
  html+=renderSections({sections:food.sections});
  html+=`</div></div>`;
  return html;
}

function renderDay(d){
  const dayData=d.days[state.day];
  const availTypes=d.food?TYPES:TYPES.filter(t=>t!=="Food");
  const types=state.type==="All"?availTypes:(availTypes.includes(state.type)?[state.type]:availTypes);
  let html=`<div class="day-header"><span class="emoji">${dayEmoji[state.name][state.day]}</span><div><h2>${state.day}</h2></div><span class="tag">${dayTag[state.name][state.day]}</span></div>`;

  types.forEach(t=>{
    if(t==="Food"){html+=renderFoodCard(d.food);return}
    const sec=dayData[t];
    if(!sec)return;
    html+=`<div class="card ${t}"><div class="card-head"><div><div class="card-type">${typeEmoji[t]} ${t.toUpperCase()}</div><div class="card-title">${sec.title}</div></div><div class="card-time">${sec.time}</div></div>`;
    if(sec.note) html+=`<div class="card-note">${sec.note}</div>`;
    html+=`<div class="card-body">${renderSections(sec)}</div></div>`;
  });

  document.getElementById("content").innerHTML=html;
}

function renderProgress(){
  const name=state.name;
  const c=getCheckin(name);
  const h=HEIGHT_M[name];
  const bmi=(c.weight&&h)?(parseFloat(c.weight)/(h*h)).toFixed(1):null;

  let html=`<div class="day-header"><span class="emoji">\u{1F4CA}</span><div><h2>Progress</h2></div><span class="tag">${name.toUpperCase()}</span></div>`;

  html+=`<div class="prog-card">
    <div class="prog-title">Weekly Check-In</div>
    ${c.updatedAt?`<div class="prog-hint" style="margin-top:-6px;margin-bottom:12px">Last updated ${c.updatedAt}</div>`:`<div class="prog-hint" style="margin-top:-6px;margin-bottom:12px">Not logged yet</div>`}

    <label class="prog-label">Weight (kg)</label>
    <input class="prog-input" type="number" step="0.1" placeholder="kg" value="${c.weight}" onchange="onCheckinInput('weight',this.value)"/>
    ${bmi?`<div class="bmi-pill"><span class="bmi-val">${bmi}</span><span class="bmi-label">BMI</span></div>`:""}

    <label class="prog-label" style="margin-top:12px">Waist (cm)</label>
    <input class="prog-input" type="number" step="0.1" placeholder="cm" value="${c.waist}" onchange="onCheckinInput('waist',this.value)"/>

    <label class="prog-label" style="margin-top:12px">Hip (cm)</label>
    <input class="prog-input" type="number" step="0.1" placeholder="cm" value="${c.hip}" onchange="onCheckinInput('hip',this.value)"/>

    <div class="prog-subtitle">Water intake</div>
    <div class="flag-row">
      <div class="flag-chip ${c.water==="Low"?"active-red":""}" onclick="setWater('Low')">Low</div>
      <div class="flag-chip ${c.water==="OK"?"active-yellow":""}" onclick="setWater('OK')">OK</div>
      <div class="flag-chip ${c.water==="Good"?"active-green":""}" onclick="setWater('Good')">Good</div>
    </div>

    <div class="prog-subtitle">Food / macro adherence</div>
    <div class="flag-row">
      <div class="flag-chip ${c.food==="Poor"?"active-red":""}" onclick="setFood('Poor')">Poor</div>
      <div class="flag-chip ${c.food==="OK"?"active-yellow":""}" onclick="setFood('OK')">OK</div>
      <div class="flag-chip ${c.food==="Good"?"active-green":""}" onclick="setFood('Good')">Good</div>
    </div>

    <label class="prog-label" style="margin-top:12px">Notes</label>
    <textarea class="prog-input" rows="2" placeholder="Anything worth remembering..." onchange="onCheckinInput('notes',this.value)">${c.notes}</textarea>
    <div class="prog-hint">Update whenever you actually measure \u2013 weekly is plenty. Nothing here expires or resets.</div>
  </div>`;

  document.getElementById("content").innerHTML=html;
}

function render(){
  const d=DATA[state.name];

  // Name buttons
  let nh="";
  NAMES.forEach(n=>{nh+=`<button class="btn name-btn ${state.name===n?"active":""}" onclick="setState('name','${n}')">${n}</button>`});
  document.getElementById("nameRow").innerHTML=nh;

  // Day buttons + Progress tab
  let dh="";
  DAYS.forEach(dy=>{
    const active=state.view==="plan"&&state.day===dy;
    dh+=`<button class="btn day-btn ${active?"active":""}" onclick="selectDay('${dy}')"><div>${dayShort[dy]}</div><div class="label">${dayTag[state.name][dy]}</div></button>`;
  });
  dh+=`<button class="btn day-btn prog-tab ${state.view==="checklist"?"active":""}" onclick="setView('checklist')"><div>\u{1F4CA}</div><div class="label">PROGRESS</div></button>`;
  document.getElementById("dayRow").innerHTML=dh;

  // Type buttons (hidden in progress view)
  const typeRowEl=document.getElementById("typeRow");
  if(state.view==="checklist"){
    typeRowEl.style.display="none";
  }else{
    typeRowEl.style.display="flex";
    const availTypes=d.food?TYPES:TYPES.filter(t=>t!=="Food");
    let th="";
    ["All",...availTypes].forEach(t=>{
      const em=t==="All"?"\u{1f4cb}":typeEmoji[t];
      th+=`<button class="btn type-btn ${state.type===t?"active":""}" data-t="${t}" onclick="setState('type','${t}')">${em} ${t}</button>`;
    });
    typeRowEl.innerHTML=th;
  }

  if(state.view==="checklist"){renderProgress()}
  else{renderDay(d)}

  // Scroll active tab into view
  setTimeout(()=>{
    const activeDay=document.querySelector(".day-btn.active");
    if(activeDay) activeDay.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  },50);
}

function selectDay(dy){state.day=dy;state.view="plan";render()}
function setView(v){state.view=v;render()}
function setState(key,val){state[key]=val;if(key==="name")state.type="All";render()}

// Register Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js?v=11').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
